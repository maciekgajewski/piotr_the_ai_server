group: dsa_time
type: dsa_time

cases:
  - id: short_local_time
    task:
      id: t1
      domain: time
      request: Która godzina?
      depends_on: []
    expected_result:
      status: ok
      timezone: Europe/Warsaw
      location: Wrocław
      time: "10:46"
    expected_replies:
      - exact: dziesiąta czterdzieści sześć

  - id: jacksonville_time
    task:
      id: t1
      domain: time
      request: która godzina jest teraz w Jacksonville
      depends_on: []
    expected_result:
      status: ok
      timezone: America/New_York
      location: Jacksonville
      time: "04:46"
    expected_replies:
      - contains_all: [Jacksonville, czwarta, czterdzieści, sześć]

  - id: day_of_week
    task:
      id: t1
      domain: time
      request: jaki jest dzień tygodnia?
      depends_on: []
    expected_result:
      status: ok
      components:
        day_of_week: sobota
    expected_replies:
      - contains_all: [sobota]
