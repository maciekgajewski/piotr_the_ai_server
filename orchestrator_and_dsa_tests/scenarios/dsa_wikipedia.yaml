group: dsa_wikipedia
type: dsa_wikipedia

cases:
  - id: birth_year
    task:
      id: t1
      domain: wikipedia
      request: W którym roku urodził się Albert Einstein?
      depends_on: []
    expected_result:
      status: ok
      language: pl
      title: Albert Einstein
    expected_replies:
      - contains_all: [Albert Einstein, "1879"]

  - id: where_is
    task:
      id: t1
      domain: wikipedia
      request: Gdzie jest Jacksonville?
      depends_on: []
    expected_result:
      status: ok
      language: en
      title: Jacksonville, Florida
    expected_replies:
      - contains_all: [Jacksonville, Florida]

  - id: coordinates
    task:
      id: t1
      domain: wikipedia
      request: jakie są współrzędne Jacksonville
      depends_on: []
    expected_result:
      status: ok
      language: en
      title: Jacksonville, Florida
    expected_replies:
      - contains_all: ["30.3322", "-81.6557"]

  - id: summary
    task:
      id: t1
      domain: wikipedia
      request: kim był John Henry?
      depends_on: []
    expected_result:
      status: ok
      language: en
      title: John Henry (folklore)
    expected_replies:
      - contains_all: [John Henry, ludowym]
