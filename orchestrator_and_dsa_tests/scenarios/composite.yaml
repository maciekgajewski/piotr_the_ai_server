group: composite
type: composite

cases:
  - id: ha_only
    messages:
      - wyłącz klimatyzację
    expected_tasks:
      - domain: home_assistant
        request:
          $nonempty: true
    expected_calls:
      - tool: modify_device
        arguments:
          device: Study air conditioner
          property_name: hvac_mode
          value: "off"
    expected_effects:
      - device: Study air conditioner
        property_name: hvac_mode
        value: "off"
    expected_replies:
      - contains_all: [klimatyz]

  - id: time_only
    messages:
      - Która godzina?
    expected_tasks:
      - domain: time
        request:
          $nonempty: true
    expected_replies:
      - contains_all: [dziesiąta, czterdzieści, sześć]

  - id: wikipedia_only
    messages:
      - W którym roku urodził się Albert Einstein według Wikipedii?
    expected_tasks:
      - domain: wikipedia
        request:
          $nonempty: true
    expected_replies:
      - contains_all: [Einstein, "1879"]

  - id: media_spotify_prefers_ma_duplicate
    messages:
      - Spotify!
    expected_tasks:
      - domain: media_player
        request:
          $nonempty: true
    expected_calls:
      - tool: list_media_players
        arguments:
          area_name: office
          music_assistant_only: false
          speakers_only: true
      - tool: list_media_players
        arguments:
          area_name: ""
          music_assistant_only: false
          speakers_only: true
      - tool: music_assistant_get_queue
        arguments:
          entity_id: media_player.office_2
      - tool: media_player_play
        arguments:
          entity_ids: [media_player.office_2]
    expected_replies:
      - contains_all: [Wznawiam, muzykę]

  - id: media_rock_genre_selection
    messages:
      - Graj muzykę rockową
    expected_tasks:
      - domain: media_player
        request:
          $nonempty: true
    expected_calls:
      - tool: list_media_players
        arguments:
          area_name: office
          music_assistant_only: false
          speakers_only: true
      - tool: music_assistant_search
        arguments:
          name: muzykę rockową
          media_type: ""
          limit: 5
      - tool: music_assistant_play_media
        arguments:
          entity_ids: [media_player.office_2]
          media_id: spotify:search:muzyke-rockowa
          media_type: playlist
    expected_replies:
      - contains_all: [rock]

  - id: media_my_favourites_uses_user_playlist
    messages:
      - Graj moje ulubione
    expected_tasks:
      - domain: media_player
        request:
          $nonempty: true
    expected_calls:
      - tool: list_media_players
        arguments:
          area_name: office
          music_assistant_only: false
          speakers_only: true
      - tool: music_assistant_play_media
        arguments:
          entity_ids: [media_player.office_2]
          media_id: library://playlist/7
          media_type: playlist
    expected_replies:
      - contains_all: [Liked Songs macson_g]

  - id: media_work_playlist_multi_room_groups_outputs
    messages:
      - Graj muzykę do pracy w salonie, w łazience i w pracowni
    expected_tasks:
      - domain: media_player
        request:
          $nonempty: true
    expected_calls:
      - tool: list_media_players
        arguments:
          area_name: living_room
          music_assistant_only: false
          speakers_only: true
      - tool: list_media_players
        arguments:
          area_name: bathroom
          music_assistant_only: false
          speakers_only: true
      - tool: list_media_players
        arguments:
          area_name: office
          music_assistant_only: false
          speakers_only: true
      - tool: music_assistant_search
        arguments:
          name: Post Rock Focus
          media_type: playlist
          limit: 5
      - tool: media_player_join
        arguments:
          entity_id: media_player.office_2
          group_members: [media_player.living_room_2, media_player.bathroom_2]
      - tool: music_assistant_play_media
        arguments:
          entity_ids: [media_player.office_2]
          media_id: spotify:search:post-rock-focus
          media_type: playlist
      - tool: media_player_shuffle_set
        arguments:
          entity_ids: [media_player.office_2]
          shuffle: true
    expected_replies:
      - contains_all: [Post Rock Focus]

  - id: ha_time_combo
    messages:
      - wyłącz klimę w biurze i powiedz która godzina jest teraz w Jacksonville
    expected_tasks:
      - domain: home_assistant
        request:
          $nonempty: true
      - domain: time
        request:
          $nonempty: true
    expected_calls:
      - tool: modify_device
        arguments:
          device: Study air conditioner
          property_name: hvac_mode
          value: "off"
    expected_effects:
      - device: Study air conditioner
        property_name: hvac_mode
        value: "off"
    expected_replies:
      - contains_all: [klimatyz, Jacksonville]

  - id: ha_pracownia_alias
    messages:
      - wyłącz klimatyzację w pracowni
    expected_tasks:
      - domain: home_assistant
        request:
          $nonempty: true
    expected_calls:
      - tool: modify_device
        arguments:
          device: Study air conditioner
          property_name: hvac_mode
          value: "off"
    expected_effects:
      - device: Study air conditioner
        property_name: hvac_mode
        value: "off"
    expected_replies:
      - contains_all: [klimatyz]

  - id: ha_wikipedia_combo
    messages:
      - włącz klimę w salonie i sprawdź w Wikipedii rok urodzenia Einsteina
    expected_tasks:
      - domain: home_assistant
        request:
          $nonempty: true
      - domain: wikipedia
        request:
          $nonempty: true
    expected_calls:
      - tool: modify_device
        arguments:
          device: Living room air conditioner
    expected_replies:
      - contains_all: [klimatyz, Einstein, "1879"]

  - id: clarification_followup
    messages:
      - Ustaw klimatyzację w salonie
      - Na 22 stopnie
    expected_tasks:
      - domain: home_assistant
        request:
          $nonempty: true
      - domain: home_assistant
        request:
          $nonempty: true
    expected_calls:
      - tool: modify_device
        arguments:
          device: Living room air conditioner
          property_name: target_temperature
          value: 22
    expected_effects:
      - device: Living room air conditioner
        property_name: target_temperature
        value: 22
    expected_replies:
      - contains_all: [temperatur]
      - contains_all: ["22"]
    expected_planning_requests: 1
